# Heart service, proxied from the same origin as the gallery.
#
# For an nginx deployment. If your Ghost stack sits behind Caddy instead, use
# caddy-hearts.txt.
#
# Same origin is the whole design: no CORS, no second certificate, no second
# port open to the world. Everything else on the domain keeps reaching Ghost.

# --- goes in the http { } block, NOT inside server { } --------------------
# limit_req_zone $binary_remote_addr zone=hearts:10m rate=30r/m;

# --- goes in the server { } block for your site ---------------------------

# The admin endpoint. Listed first for readability; nginx matches the longest
# prefix regardless of order, so this wins over /api/hearts below.
#
# The service already requires its own admin token, so this block is defence
# in depth rather than the only lock. Uncomment the auth_basic lines if you
# want a second one:
#   sudo apt install apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd <username>
location /api/hearts/_photos {
    # auth_basic           "photo-scout admin";
    # auth_basic_user_file /etc/nginx/.htpasswd;
    client_max_body_size 1m;          # the allowlist for a few thousand photos
    proxy_pass         http://127.0.0.1:8091;
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-For $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

location /api/hearts {
    limit_req            zone=hearts burst=10 nodelay;
    client_max_body_size 16k;         # nothing a visitor sends is large
    proxy_pass         http://127.0.0.1:8091;
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-For $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;

    # Counts change constantly and are per-visitor in part; never let a CDN or
    # the browser serve a stale one.
    proxy_hide_header  Cache-Control;
    add_header         Cache-Control "no-store" always;
}
